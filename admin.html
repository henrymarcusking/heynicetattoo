<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>heynicetattoo — Review Queue</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: oklch(98% 0.003 250);
    --surface: oklch(100% 0 0);
    --border: oklch(89% 0.004 250);
    --text: oklch(20% 0.004 250);
    --muted: oklch(50% 0.005 250);
    --blue: oklch(47% 0.1 258);
    --blue-tint: oklch(94% 0.02 258);
    --chip-bg: oklch(93% 0.004 250);
    --green: oklch(48% 0.12 150);
    --red: oklch(50% 0.13 25);
    --error: oklch(52% 0.15 25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Work Sans', system-ui, sans-serif; }
  button, input { font-family: inherit; }
  a { color: var(--blue); }

  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
  .view { display: none; flex-direction: column; flex: 1; }
  .view.active { display: flex; }

  /* Login */
  #view-login { align-items: center; justify-content: center; padding: 28px; }
  #view-login .card { width: 100%; max-width: 320px; }
  #view-login h1 { font-size: 20px; margin: 0 0 4px; }
  #view-login p { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: var(--surface); color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--blue); }
  .btn {
    height: 44px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { width: 100%; background: var(--blue); color: white; margin-top: 6px; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error { margin-top: 12px; font-size: 13px; color: var(--error); display: none; }
  .login-error.show { display: block; }

  /* Top bar */
  .topbar {
    height: 56px; flex-shrink: 0; padding: 0 20px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .topbar .title { font-weight: 700; font-size: 17px; flex: 1; }
  .topbar .back { cursor: pointer; display: flex; }
  .signout-link { font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; background: none; border: none; }
  .badge { background: var(--blue-tint); color: var(--blue); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }

  /* Tabs */
  .tabs { height: 44px; flex-shrink: 0; padding: 0 20px; display: flex; gap: 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab { height: 100%; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; padding: 0; }
  .tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--blue); }

  /* List */
  .list { flex: 1; overflow-y: auto; padding: 0 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; }
  .thumb { width: 48px; height: 48px; border-radius: 8px; background: oklch(92% 0.005 250); flex-shrink: 0; object-fit: cover; }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; }
  .row-top .id { font-weight: 600; font-size: 14px; }
  .row-top .time { font-size: 12px; color: var(--muted); }
  .row-bottom { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .chip.feature { background: var(--blue-tint); color: var(--blue); }
  .chip.private { background: var(--chip-bg); color: var(--muted); }
  .chip.approved { background: oklch(92% 0.05 150); color: var(--green); }
  .chip.rejected { background: oklch(93% 0.04 25); color: var(--red); }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  /* Detail */
  .detail-body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .detail-photo { width: 100%; aspect-ratio: 4/3; border-radius: 10px; object-fit: cover; background: oklch(90% 0.006 250); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .audio-row { display: flex; align-items: center; gap: 12px; }
  .play-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--blue); background: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .play-btn svg { fill: var(--blue); }
  .contact-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .contact-row:last-child { border-bottom: none; }
  .contact-row .val { font-size: 13.5px; color: var(--text); flex: 1; text-decoration: none; }
  .copy-btn { font-size: 12px; font-weight: 600; color: var(--blue); background: none; border: none; cursor: pointer; }
  .consent-banner { display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 12px; }
  .consent-banner.feature { background: var(--blue-tint); }
  .consent-banner.private { background: var(--chip-bg); }
  .consent-banner .label { font-size: 13.5px; font-weight: 600; }
  .consent-help { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .action-bar { height: 72px; flex-shrink: 0; padding: 14px 20px; display: flex; gap: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .action-bar .btn { flex: 1; }
  .btn-reject { border: 1.5px solid var(--red); color: var(--red); background: none; }
  .btn-approve { background: var(--green); color: white; }
  .status-note { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<div class="app">

  <!-- Login -->
  <section id="view-login" class="view active">
    <div class="card">
      <h1>Review Queue</h1>
      <p>Sign in with your heynicetattoo admin account.</p>
      <form id="login-form" novalidate onsubmit="return false;">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password">
        </div>
      </form>
      <button class="btn btn-primary" id="btn-login">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </section>

  <!-- Queue -->
  <section id="view-queue" class="view">
    <div class="topbar">
      <div class="title">Review Queue</div>
      <span class="badge" id="pending-badge">…</span>
      <button class="signout-link" id="btn-signout">Sign out</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-status="pending">Pending</button>
      <button class="tab" data-status="approved">Approved</button>
      <button class="tab" data-status="rejected">Rejected</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- Detail -->
  <section id="view-detail" class="view">
    <div class="topbar">
      <span class="back" id="btn-back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </span>
      <div class="title" id="detail-title">Submission</div>
    </div>
    <div class="detail-body" id="detail-body"></div>
    <div class="action-bar" id="action-bar">
      <button class="btn btn-reject" id="btn-reject">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        Reject
      </button>
      <button class="btn btn-approve" id="btn-approve">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        Approve
      </button>
    </div>
  </section>

</div>

<script>
  // ---- Supabase setup ----
  // Fill these in after creating your Supabase project — see README.md.
  const SUPABASE_URL = "https://uczxkcnhibipksvuffck.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_w7nmb4-UuD17zQQ_SmQd7A_SqPWmuzn";
  let supabaseClient = null;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.warn('Supabase is not configured yet — fill in SUPABASE_URL / SUPABASE_ANON_KEY. See README.md.', e);
  }

  const views = ['view-login', 'view-queue', 'view-detail'];
  function showView(id) {
    views.forEach(v => document.getElementById(v).classList.toggle('active', v === id));
  }

  // ---- Auth ----
  async function checkSession() {
    if (!supabaseClient) {
      const errEl = document.getElementById('login-error');
      errEl.textContent = "This app isn't connected to Supabase yet — see README.md.";
      errEl.classList.add('show');
      document.getElementById('btn-login').disabled = true;
      showView('view-login');
      return;
    }
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showView('view-queue');
      loadList();
    } else {
      showView('view-login');
    }
  }

  document.getElementById('btn-login').addEventListener('click', async () => {
    if (!supabaseClient) return;
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('show');
    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Sign in';
    if (error) {
      errEl.textContent = 'Wrong email or password.';
      errEl.classList.add('show');
      return;
    }
    showView('view-queue');
    loadList();
  });

  document.getElementById('btn-signout').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    showView('view-login');
  });

  // ---- List ----
  let currentStatus = 'pending';
  let currentRows = [];

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentStatus = tab.dataset.status;
      loadList();
    });
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(str) {
    return escapeHtml(str);
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.floor(hours / 24) + 'd ago';
  }

  async function loadList() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '<div class="empty-state">Loading…</div>';

    const { data, error } = await supabaseClient
      .from('submissions')
      .select('*')
      .eq('status', currentStatus)
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = '<div class="empty-state">Couldn\'t load submissions.</div>';
      return;
    }

    currentRows = data || [];

    const { count } = await supabaseClient
      .from('submissions')
      .select('id', { count: 'exact', head: true })
      .eq('status', 'pending');
    document.getElementById('pending-badge').textContent = (count ?? 0) + ' pending';

    if (currentRows.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
      return;
    }

    listEl.innerHTML = '';
    for (const row of currentRows) {
      const btn = document.createElement('button');
      btn.className = 'row';
      btn.innerHTML = `
        <img class="thumb" data-path="${row.photo_path}">
        <div class="row-main">
          <div class="row-top">
            <span class="id">#${row.id.slice(0, 6)}</span>
            <span class="time">${timeAgo(row.created_at)}</span>
          </div>
          <div class="row-bottom">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
            <span class="chip ${row.consent}">${row.consent === 'feature' ? 'Instagram' : 'Private'}</span>
          </div>
        </div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      `;
      btn.addEventListener('click', () => openDetail(row));
      listEl.appendChild(btn);

      const img = btn.querySelector('.thumb');
      supabaseClient.storage.from('submissions').createSignedUrl(row.photo_path, 3600).then(({ data }) => {
        if (data) img.src = data.signedUrl;
      });
    }
  }

  // ---- Detail ----
  let activeRow = null;

  document.getElementById('btn-back').addEventListener('click', () => {
    showView('view-queue');
    loadList();
  });

  async function openDetail(row) {
    activeRow = row;
    document.getElementById('detail-title').textContent = 'Submission #' + row.id.slice(0, 6);
    document.getElementById('action-bar').style.display = row.status === 'pending' ? 'flex' : 'none';

    const body = document.getElementById('detail-body');
    body.innerHTML = '<div class="empty-state">Loading…</div>';
    showView('view-detail');

    const [{ data: photoSigned }, { data: audioSigned }] = await Promise.all([
      supabaseClient.storage.from('submissions').createSignedUrl(row.photo_path, 3600),
      supabaseClient.storage.from('submissions').createSignedUrl(row.audio_path, 3600),
    ]);

    const contactRows = [];
    if (row.phone) contactRows.push(`<div class="contact-row"><a class="val" href="tel:${escapeAttr(row.phone)}">${escapeHtml(row.phone)}</a><button class="copy-btn" data-copy="${escapeAttr(row.phone)}">Copy</button></div>`);
    if (row.email) contactRows.push(`<div class="contact-row"><a class="val" href="mailto:${escapeAttr(row.email)}">${escapeHtml(row.email)}</a><button class="copy-btn" data-copy="${escapeAttr(row.email)}">Copy</button></div>`);
    if (row.instagram) {
      const handle = row.instagram.replace(/^@/, '');
      contactRows.push(`<div class="contact-row"><a class="val" href="https://instagram.com/${escapeAttr(handle)}" target="_blank" rel="noopener">${escapeHtml(row.instagram)}</a><button class="copy-btn" data-copy="${escapeAttr(row.instagram)}">Copy</button></div>`);
    }
    if (row.found_location) {
      contactRows.push(`<div class="contact-row"><span class="val" style="color:var(--muted); font-size:12px;">Found via</span><span class="val" style="flex:2; text-align:right;">${escapeHtml(row.found_location)}</span></div>`);
    }

    const isFeature = row.consent === 'feature';
    const statusNote = row.status !== 'pending'
      ? `<div class="status-note">Marked <strong>${row.status}</strong>.</div>`
      : '';

    body.innerHTML = `
      <img class="detail-photo" src="${photoSigned ? photoSigned.signedUrl : ''}" alt="Submitted tattoo photo">
      <div class="card">
        <div class="card-label">Audio story</div>
        <div class="audio-row">
          <button class="play-btn" id="detail-play"><svg id="detail-play-icon" viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14l11-7z"/></svg></button>
          <div class="waveform" style="flex:1; height:28px; display:flex; align-items:center; gap:3px;"></div>
          <audio id="detail-audio" src="${audioSigned ? audioSigned.signedUrl : ''}" style="display:none;"></audio>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Contact</div>
        ${contactRows.join('') || '<div class="contact-row"><span class="val" style="color:var(--muted);">No contact details</span></div>'}
      </div>
      <div class="card">
        <div class="card-label">Consent</div>
        <div class="consent-banner ${row.consent}">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="${isFeature ? 'var(--blue)' : 'var(--muted)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            ${isFeature
              ? '<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/>'
              : '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/>'}
          </svg>
          <span class="label">${isFeature ? 'Wants to be featured on Instagram' : 'Wants to keep this private'}</span>
        </div>
        ${isFeature ? '<div class="consent-help">This is just their interest — get an explicit OK by message before posting anything.</div>' : ''}
      </div>
      ${statusNote}
    `;

    body.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const original = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });

    const audioEl = document.getElementById('detail-audio');
    const playBtn = document.getElementById('detail-play');
    const playIcon = document.getElementById('detail-play-icon');
    let playing = false;
    playBtn.addEventListener('click', () => { playing ? audioEl.pause() : audioEl.play(); });
    audioEl.addEventListener('play', () => { playing = true; playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'; });
    audioEl.addEventListener('pause', resetIcon);
    audioEl.addEventListener('ended', resetIcon);
    function resetIcon() { playing = false; playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
  }

  async function setStatus(status) {
    if (!activeRow) return;
    const { error } = await supabaseClient.from('submissions').update({ status }).eq('id', activeRow.id);
    if (error) {
      alert("Couldn't update this submission. Please try again.");
      return;
    }
    showView('view-queue');
    loadList();
  }
  document.getElementById('btn-approve').addEventListener('click', () => setStatus('approved'));
  document.getElementById('btn-reject').addEventListener('click', () => setStatus('rejected'));

  checkSession();
</script>
</body>
</html>
